<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Új képesség</title>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/css/pico/pico.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="container-fluid">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 id="title"></h1>
        <script>document.getElementById("title").innerHTML = `Bivalyhágnádi Cicccaaaaaügyi Minisztérium | ${document.title}`</script>
    </div>
</header>
<main class="container-fluid">
    <div class="left-aligned-screenfill-flexbox">
        <form id="ability-submission-form" method="post">
            <label for="ability-form-name">Név</label>
            <input type="text" name="name" id="ability-form-name" required/>
            <label for="ability-form-shortDesc">Rövid leírás</label>
            <input type="text" name="shortDesc" id="ability-form-shortDesc" required/>
            <label for="ability-form-longDesc">Hosszú leírás</label>
            <input type="text" name="longDesc" id="ability-form-longDesc" required style="height: 45%"/>
            <label for="ability-form-imgPath">Kép fájl elérési útja a szerveren (igen, ezt a felhasználó feladata megadni)</label>
            <input type="text" name="imgPath" id="ability-form-imgPath" required/>
            <button type="submit">Mentés</button>
        </form>
        <script>
            document.getElementById("ability-submission-form").addEventListener("submit", async (event) => {
                event.preventDefault()
                const data = Object.fromEntries(new FormData(event.currentTarget).entries())

                const res = await fetch("/api/abilities/add", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(data)
                })

                console.log(res)

                if (res.ok) {
                    window.location.assign("/index.html")
                }
            })
        </script>
    </div>
</main>

<footer class="container-fluid">
    <div class="cat-controls">
        <button onclick="window.location.href='/index.html'">Vissza a főoldalra</button>
    </div>
</footer>

</body>
</html>
