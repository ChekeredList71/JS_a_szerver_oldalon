services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: backend
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync+restart
          path: ./
          target: /app
          ignore:
            - beadasok
            - node_modules
            - spec
        - action: rebuild
          path: ./package.json
volumes:
  mongodb_data:
